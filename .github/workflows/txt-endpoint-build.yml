name: TXT Endpoint APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/txt-dynamic-endpoint

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          sed -i '10i\
          \
              ndkVersion = "30.0.16248370"' V2rayNG/app/build.gradle.kts

      - name: Restore libhevtun cache
        id: cache-libhevtun
        uses: actions/cache@v5
        with:
          path: libs
          key: libhevtun-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD', 'compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r libs V2rayNG/app

      - name: Find AndroidLibXrayLite release
        run: |
          git -C AndroidLibXrayLite fetch --tags --force origin
          CURRENT_TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/txtentry.jks" \
            -storepass android \
            -keypass android \
            -alias txtentry \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=v2rayNG TXT"

      - name: Test and build release APK
        working-directory: V2rayNG
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest --tests com.v2ray.ang.core.TxtEndpointResolverTest
          ./gradlew :app:assemblePlaystoreRelease \
            -PABI_FILTERS=arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/txtentry.jks" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=txtentry \
            -Pandroid.injected.signing.key.password=android

      - name: Verify coexistence package
        working-directory: V2rayNG
        run: |
          APK=$(find app/build/outputs/apk/playstore/release -name '*arm64-v8a*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.v2ray.ang.txtentry'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'v2rayNG TXT'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p "$RUNNER_TEMP/apk-out"
          zip -9 -j "$RUNNER_TEMP/apk-out/$(basename "$APK" .apk).zip" "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-txt-endpoint-arm64
          path: ${{ runner.temp }}/apk-out/*.zip
          compression-level: 9
          if-no-files-found: error
